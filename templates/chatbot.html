<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        AI Chatbot
    </title>

    <!-- Bootstrap -->

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- Font Awesome -->

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        .chat-card {

            background: white;

            border-radius: 20px;

            padding: 40px;

            box-shadow: 0 4px 20px rgba(0,0,0,0.1);

        }

        .ai-response {

            background: #e8f0ff;

            padding: 20px;

            border-radius: 15px;

            margin-top: 30px;

        }

    </style>

</head>

<body class="dashboard-body">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2 class="logo">
            StudyMate AI
        </h2>

        <ul class="sidebar-menu">

            <li>
                <a href="/dashboard">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="/chatbot">
                    AI Chatbot
                </a>
            </li>

            <li>
                <a href="/logout">
                    Logout
                </a>
            </li>

        </ul>

    </div>

    <!-- MAIN CONTENT -->

    <div class="main-content">

        <div class="topbar mb-4">

            <h1>
                AI Study Assistant 🤖
            </h1>

            <p>
                Ask coding and academic doubts instantly.
            </p>

        </div>

        <!-- CHATBOX -->

        <div class="chat-card">

            <form method="POST">

                <div class="mb-4">

                    <label class="form-label">
                        Ask Your Question
                    </label>

                    <textarea
                    name="message"
                    rows="5"
                    class="form-control"
                    placeholder="Ask about Python, AI, HTML, CSS..."
                    required></textarea>

                </div>

                <button
                type="submit"
                class="btn btn-primary">

                    <i class="fa-solid fa-paper-plane"></i>

                    Ask AI

                </button>

            </form>

            {% if reply %}

            <div class="ai-response">

                <h4>
                    AI Response
                </h4>

                <hr>

                <p>
                    {{ reply }}
                </p>

            </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
