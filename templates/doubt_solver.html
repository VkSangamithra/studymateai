<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        AI Doubt Solver
    </title>

    <!-- Bootstrap -->

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body {

            background: #f4f7fb;

        }

        .main-card {

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 4px 20px rgba(0,0,0,0.1);

            margin-bottom: 50px;

        }

        .result-box {

            white-space: pre-wrap;

            overflow-wrap: break-word;

            word-break: break-word;

            line-height: 1.8;

            font-size: 17px;

            padding: 20px;

            border-radius: 12px;

            width: 100%;

        }

        .solve-btn {

            padding: 12px 30px;

            border-radius: 10px;

            font-size: 18px;

            font-weight: bold;

        }

    </style>

</head>

<body>

<div class="container mt-5">

    <div class="main-card">

        <!-- TITLE -->
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h1 class="fw-bold mb-0">
                AI Doubt Solver 📸🧠
            </h1>
            <a href="/dashboard" class="btn btn-outline-secondary">← Back to Dashboard</a>
        </div>

        <p class="text-muted mt-2">
            Upload question images or type your question to get instant, step-by-step AI solutions.
        </p>

        <!-- FORM -->
        <form method="POST" enctype="multipart/form-data" class="mt-4">

            <label class="form-label fw-semibold">
                📷 Upload Question Image (OCR)
            </label>
            <input
                type="file"
                name="image"
                id="imageInput"
                class="form-control form-control-lg"
                accept="image/*">

            <div class="my-3 text-center text-muted fw-bold">─── OR ───</div>

            <label class="form-label fw-semibold">
                ✍️ Type or Paste Question Text
            </label>
            <textarea
                name="question_text"
                id="questionTextInput"
                class="form-control"
                rows="3"
                placeholder="Type your question or academic doubt here..."></textarea>

            <button
                type="submit"
                class="btn btn-primary mt-4 solve-btn">
                ⚡ Solve Question
            </button>

        </form>

        <!-- EXTRACTED TEXT -->

        {% if extracted_text %}

        <div class="card shadow-sm mt-5 border-0">

            <div class="card-body">

                <h2 class="mb-3 fw-bold">

                    Extracted Question

                </h2>

                <hr>

                <div class="bg-light border result-box">

                    {{ extracted_text }}

                </div>

            </div>

        </div>

        {% endif %}

        <!-- AI ANSWER -->

        {% if ai_answer %}

        <div class="card shadow-sm mt-4 border-0">

            <div class="card-body">

                <h2 class="mb-3 fw-bold">

                    AI Answer

                </h2>

                <hr>

                <div class="bg-success-subtle border result-box">

                    {{ ai_answer }}

                </div>

            </div>

        </div>

        {% endif %}

    </div>

</div>

</body>

</html>
