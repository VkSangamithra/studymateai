<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        AI PDF Summarizer
    </title>

    <!-- Bootstrap -->

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- TITLE -->

    <h1 class="mb-4">
        AI PDF Summarizer 📕
    </h1>

    <!-- FORM -->

    <form
    method="POST"
    enctype="multipart/form-data">

        <div class="mb-3">

            <input
            type="file"
            name="pdf"
            class="form-control"
            accept=".pdf"
            required>

        </div>

        <button
        type="submit"
        class="btn btn-primary">

            Generate Summary

        </button>

    </form>

    <!-- SUMMARY RESULT -->

    {% if summary %}

    <div class="card shadow-sm mt-5">

        <div class="card-body">

            <h2 class="mb-4">
                Summary Result
            </h2>

            <div class="alert alert-success">

                {{ summary }}

            </div>

        </div>

    </div>

    {% endif %}

</div>

</body>

</html>
