<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        Student Profile
    </title>

    <!-- Bootstrap -->

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- Font Awesome -->

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{

            background:#eef2f7;
            font-family:Arial, Helvetica, sans-serif;

        }

        .profile-card{

            background:white;
            border-radius:20px;
            padding:50px;
            box-shadow:0px 10px 25px rgba(0,0,0,0.1);

        }

        .profile-img{

            width:160px;
            height:160px;
            border-radius:50%;
            object-fit:cover;
            border:5px solid #2563eb;

        }

        .profile-name{

            font-size:45px;
            font-weight:bold;
            margin-top:20px;

        }

        .profile-email{

            color:gray;
            font-size:18px;

        }

        .info-box{

            background:#f8fafc;
            padding:20px;
            border-radius:15px;
            margin-top:20px;

        }

        .info-box h5{

            font-weight:bold;
            margin-bottom:10px;

        }

        .edit-btn{

            border-radius:30px;
            padding:10px 30px;
            font-size:18px;

        }

    </style>

</head>

<body>

<div class="container mt-5 mb-5">

    <div class="profile-card">

        <!-- PROFILE IMAGE -->

        <div class="text-center">

            {% if user.photo %}

                <img
                src="{{ url_for('static', filename='uploads/' + user.photo) }}"
                class="profile-img">

            {% else %}

                <img
                src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                class="profile-img">

            {% endif %}

            <h1 class="profile-name">
                {{ user.name }}
            </h1>

            <p class="profile-email">
                {{ user.email }}
            </p>

            <!-- EDIT BUTTON -->

            <button
            class="btn btn-primary edit-btn mt-3"
            data-bs-toggle="modal"
            data-bs-target="#editProfileModal">

                <i class="fa-solid fa-pen"></i>

                Edit Profile

            </button>

        </div>

        <hr class="mt-5 mb-4">

        <!-- PROFILE DETAILS -->

        <div class="row">

            <div class="col-md-6">

                <div class="info-box">

                    <h5>
                        <i class="fa-solid fa-building"></i>

                        Department
                    </h5>

                    <p>
                        {{ user.department }}
                    </p>

                </div>

            </div>

            <div class="col-md-6">

                <div class="info-box">

                    <h5>
                        <i class="fa-solid fa-graduation-cap"></i>

                        College
                    </h5>

                    <p>
                        {{ user.college }}
                    </p>

                </div>

            </div>

            <div class="col-md-6">

                <div class="info-box">

                    <h5>
                        <i class="fa-solid fa-phone"></i>

                        Phone Number
                    </h5>

                    <p>
                        {{ user.phone }}
                    </p>

                </div>

            </div>

            <div class="col-md-6">

                <div class="info-box">

                    <h5>
                        <i class="fa-solid fa-location-dot"></i>

                        Address
                    </h5>

                    <p>
                        {{ user.address }}
                    </p>

                </div>

            </div>

            <div class="col-md-12">

                <div class="info-box">

                    <h5>
                        <i class="fa-solid fa-code"></i>

                        Skills
                    </h5>

                    <p>
                        {{ user.skills }}
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- EDIT PROFILE MODAL -->

<div class="modal fade"
id="editProfileModal"
tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Edit Profile
                </h5>

                <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal">
                </button>

            </div>

            <form method="POST"
            action="/update-profile"
            enctype="multipart/form-data">

                <div class="modal-body">

                    <input
                    type="text"
                    name="name"
                    class="form-control mb-3"
                    value="{{ user.name }}"
                    placeholder="Name">

                    <input
                    type="email"
                    name="email"
                    class="form-control mb-3"
                    value="{{ user.email }}"
                    placeholder="Email">

                    <input
                    type="text"
                    name="department"
                    class="form-control mb-3"
                    value="{{ user.department }}"
                    placeholder="Department">

                    <input
                    type="text"
                    name="college"
                    class="form-control mb-3"
                    value="{{ user.college }}"
                    placeholder="College">

                    <input
                    type="text"
                    name="phone"
                    class="form-control mb-3"
                    value="{{ user.phone }}"
                    placeholder="Phone Number">

                    <textarea
                    name="address"
                    class="form-control mb-3"
                    placeholder="Address">{{ user.address }}</textarea>

                    <textarea
                    name="skills"
                    class="form-control mb-3"
                    placeholder="Skills">{{ user.skills }}</textarea>

                    <label class="mb-2">

                        Upload Photo

                    </label>

                    <input
                    type="file"
                    name="photo"
                    class="form-control">

                </div>

                <div class="modal-footer">

                    <button
                    type="submit"
                    class="btn btn-success">

                        Save Changes

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
