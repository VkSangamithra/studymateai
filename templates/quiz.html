<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        AI Quiz Generator
    </title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="container mt-5">

    <h1>
        AI Quiz Generator 🧠
    </h1>

    <form method="POST">

        <input
        type="text"
        name="topic"
        class="form-control mt-4"
        placeholder="Enter Topic"
        required>

        <button
        class="btn btn-primary mt-3">

            Generate Quiz

        </button>

    </form>

    {% if quiz_result %}

    <div class="card mt-5 p-4">

        <h3>
            Quiz Questions
        </h3>

        <hr>

        <pre>{{ quiz_result }}</pre>

    </div>

    {% endif %}

</body>

</html>
