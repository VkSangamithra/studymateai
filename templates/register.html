<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        Register - StudyMate AI
    </title>

    <!-- Bootstrap -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- CSS -->
    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

    <div class="container">

        <div class="row justify-content-center align-items-center py-5">

            <div class="col-md-6">

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-body p-5">

                        <h2 class="text-center fw-bold mb-4">
                            Create Account
                        </h2>

                        <!-- REGISTER FORM -->

                        <form
                        method="POST"
                        autocomplete="off">

                            <!-- Hidden Inputs -->

                            <input
                            type="text"
                            style="display:none">

                            <input
                            type="password"
                            style="display:none">

                            <!-- FULL NAME -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input
                                type="text"
                                class="form-control form-control-lg"
                                name="name"
                                placeholder="Enter full name"
                                required
                                autocomplete="off">

                            </div>

                            <!-- EMAIL -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                type="email"
                                class="form-control form-control-lg"
                                name="email"
                                placeholder="Enter email"
                                required
                                autocomplete="new-email">

                            </div>

                            <!-- DEPARTMENT -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Department
                                </label>

                                <input
                                type="text"
                                class="form-control form-control-lg"
                                name="department"
                                placeholder="Department"
                                required
                                autocomplete="off">

                            </div>

                            <!-- COLLEGE -->

                            <div class="mb-4">

                                <label class="form-label">
                                    College
                                </label>

                                <input
                                type="text"
                                class="form-control form-control-lg"
                                name="college"
                                placeholder="College name"
                                required
                                autocomplete="off">

                            </div>

                            <!-- PASSWORD -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Password
                                </label>

                                <input
                                type="password"
                                class="form-control form-control-lg"
                                name="password"
                                placeholder="Create password"
                                required
                                autocomplete="new-password">

                            </div>

                            <!-- BUTTON -->

                            <div class="d-grid">

                                <button
                                type="submit"
                                class="btn btn-primary btn-lg rounded-pill">

                                    Register

                                </button>

                            </div>

                        </form>

                        <!-- LOGIN LINK -->

                        <div class="text-center mt-4">

                            <p>

                                Already have an account?

                                <a
                                href="/login"
                                class="text-decoration-none fw-bold">

                                    Login

                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
