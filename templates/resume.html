<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>AI Resume Builder</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{

            background:#eef2f7;
            padding:40px;

        }

        .resume-box{

            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.1);

        }

    </style>

</head>

<body>

<div class="container">

    <div class="resume-box">

        <h1 class="mb-4">
            AI Resume Builder 📄
        </h1>

        <form method="POST">

            <input
            type="text"
            name="name"
            class="form-control mb-3"
            placeholder="Full Name"
            required>

            <input
            type="text"
            name="role"
            class="form-control mb-3"
            placeholder="Role / Designation"
            required>

            <input
            type="email"
            name="email"
            class="form-control mb-3"
            placeholder="Email"
            required>

            <input
            type="text"
            name="phone"
            class="form-control mb-3"
            placeholder="Phone Number"
            required>

            <input
            type="text"
            name="address"
            class="form-control mb-3"
            placeholder="Address"
            required>

            <textarea
            name="objective"
            class="form-control mb-3"
            rows="3"
            placeholder="Career Objective"
            required></textarea>

            <textarea
            name="education"
            class="form-control mb-3"
            rows="3"
            placeholder="Education"
            required></textarea>

            <textarea
            name="projects"
            class="form-control mb-3"
            rows="3"
            placeholder="Projects"
            required></textarea>

            <textarea
            name="skills"
            class="form-control mb-3"
            rows="3"
            placeholder="Skills (comma separated)"
            required></textarea>

            <button
            type="submit"
            class="btn btn-success">

                Generate Resume

            </button>

        </form>

    </div>

</div>

</body>
</html>
