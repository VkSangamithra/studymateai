<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Professional Resume</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{

            background:#f4f4f4;
            padding:40px;
            font-family:Arial, Helvetica, sans-serif;

        }

        .resume-container{

            background:white;
            width:900px;
            margin:auto;
            padding:50px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.2);

        }

        .resume-header{

            text-align:center;
            margin-bottom:30px;

        }

        .resume-header h1{

            font-size:50px;
            font-weight:bold;
            letter-spacing:2px;

        }

        .resume-header h3{

            color:gray;

        }

        .contact{

            display:flex;
            justify-content:space-around;
            border-top:2px solid black;
            border-bottom:2px solid black;
            padding:10px 0;
            margin-bottom:30px;

        }

        .section{

            margin-top:30px;

        }

        .section h2{

            border-bottom:2px solid black;
            padding-bottom:8px;
            margin-bottom:15px;
            font-weight:bold;

        }

        .skills{

            display:grid;
            grid-template-columns:repeat(3,1fr);

        }

        ul{

            padding-left:20px;

        }

    </style>

</head>

<body>

<div class="resume-container">

    <!-- HEADER -->

    <div class="resume-header">

        <h1>{{ name }}</h1>

        <h3>{{ role }}</h3>

    </div>

    <!-- CONTACT -->

    <div class="contact">

        <span>📞 {{ phone }}</span>

        <span>📧 {{ email }}</span>

        <span>📍 {{ address }}</span>

    </div>

    <!-- ABOUT -->

    <div class="section">

        <h2>ABOUT ME</h2>

        <p>{{ objective }}</p>

    </div>

    <!-- EDUCATION -->

    <div class="section">

        <h2>EDUCATION</h2>

        <p>{{ education }}</p>

    </div>

    <!-- PROJECTS -->

    <div class="section">

        <h2>PROJECTS</h2>

        <p>{{ projects }}</p>

    </div>

    <!-- SKILLS -->

    <div class="section">

        <h2>SKILLS</h2>

        <div class="skills">

            {% for skill in skills.split(',') %}

                <ul>
                    <li>{{ skill }}</li>
                </ul>

            {% endfor %}

        </div>

    </div>
<<div class="text-center mt-4">

    <a href="/download/docx/{{ name }}.docx"
       class="btn btn-primary btn-lg me-3">

        Download Word Resume

    </a>

    <a href="/download/pdf/{{ name }}.pdf"
       class="btn btn-danger btn-lg">

        Download PDF Resume

    </a>

</div>
</div>

</body>
</html>
