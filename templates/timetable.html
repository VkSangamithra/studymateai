<!DOCTYPE html>
<html>

<head>

    <title>
        AI Timetable Generator
    </title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="container mt-5">

    <h1>
        AI Timetable Generator 📅
    </h1>

    <form method="POST">

        <textarea
        name="subjects"
        class="form-control mt-3"
        placeholder="Enter Subjects"
        required></textarea>

        <input
        type="text"
        name="hours"
        class="form-control mt-3"
        placeholder="Available Study Hours"
        required>

        <button
        class="btn btn-success mt-3">

            Generate Timetable

        </button>

    </form>

    {% if timetable_output %}

    <div class="card mt-5 p-4">

        <h3>
            Generated Timetable
        </h3>

        <hr>

        <pre>{{ timetable_output }}</pre>

    </div>

    {% endif %}

</body>

</html>
